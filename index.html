<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Quebra Galho | Solicitação</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <div class="container">
    <h1 class="logo">Quebra Galho</h1>
    <p class="subtitle">
      Serviço financeiro local • Operação formal • Pagamentos via Pix<br>
      <strong>Exclusivo para motoboys do Norte da Ilha – Florianópolis</strong>
    </p>
  </div>
</header>

<main class="container">
  <h2 class="title">Solicite seu Adiantamento</h2>

  <!-- IDENTIFICAÇÃO -->
  <section class="card">
    <h3>Quem é você</h3>

    <label>Nome completo</label>
    <input type="text" name="nome" placeholder="Seu nome completo">

    <label>CPF</label>
    <input type="text" name="cpf" placeholder="000.000.000-00">

    <label>WhatsApp</label>
    <input type="tel" name="whatsapp" placeholder="(48) 9xxxx-xxxx">

    <label>Bairro (Norte da Ilha)</label>
    <select name="bairro">
      <option value="">Selecione</option>
      <option>Ingleses</option>
      <option>Rio Vermelho</option>
      <option>Canasvieiras</option>
      <option>Jurerê</option>
      <option>Cachoeira do Bom Jesus</option>
      <option>Vargem Grande</option>
      <option>Vargem Pequena</option>
    </select>

    <label>Endereço residencial</label>
    <input type="text" name="endereco" placeholder="Rua / Avenida">

    <label>Número</label>
    <input type="text" name="numero" placeholder="Ex: 123">

    <label>Complemento (opcional)</label>
    <input type="text" name="complemento" placeholder="Casa, apto, fundos">
  </section>

  <!-- ATIVIDADE -->
  <section class="card">
    <h3>Atividade Profissional</h3>

    <label>
      <input type="checkbox" name="uber"> Uber Moto
    </label>

    <label>
      <input type="checkbox" name="99"> 99 Moto
    </label>

    <label>Há quanto tempo roda de app</label>
    <select name="tempo_app">
      <option value="">Selecione</option>
      <option>Menos de 6 meses</option>
      <option>6 meses a 1 ano</option>
      <option>Mais de 1 ano</option>
    </select>
  </section>

  <!-- DECLARAÇÕES -->
  <section class="card">
    <label>
      <input type="checkbox" name="declara_documentos">
      Declaro que possuo CNH válida, comprovante de residência e conta ativa em aplicativo de entrega
    </label>
  </section>

  <!-- CONDIÇÕES -->
  <section class="card highlight">
    <p>
      <strong>Condições do serviço</strong><br><br>
      Valor liberado: R$ 30<br>
      Pagamento: R$ 27 por dia<br>
      Prazo: 2 dias<br>
      Total: R$ 54
    </p>

    <label>
      <input type="checkbox" name="aceite_condicoes">
      Li e concordo com as condições do serviço
    </label>
  </section>

  <!-- RESPONSABILIDADE -->
  <section class="card warning">
    <label>
      <input type="checkbox" name="aceite_responsabilidade">
      Estou ciente e assumo total responsabilidade pelo pagamento
    </label>
  </section>

  <button type="button" class="submit-btn">Enviar Solicitação</button>
</main>

<!-- JAVASCRIPT FUNCIONAL -->
<script>
document.addEventListener("DOMContentLoaded", () => {
  const btn = document.querySelector(".submit-btn");

  btn.addEventListener("click", () => {

    const nome = document.querySelector('input[name="nome"]').value.trim();
    const cpf = document.querySelector('input[name="cpf"]').value.trim();
    const whatsapp = document.querySelector('input[name="whatsapp"]').value.trim();
    const bairro = document.querySelector('select[name="bairro"]').value;
    const endereco = document.querySelector('input[name="endereco"]').value.trim();
    const numero = document.querySelector('input[name="numero"]').value.trim();
    const complemento = document.querySelector('input[name="complemento"]').value.trim();
    const tempoApp = document.querySelector('select[name="tempo_app"]').value;

    const uber = document.querySelector('input[name="uber"]').checked;
    const noveNove = document.querySelector('input[name="99"]').checked;

    const declaraDocs = document.querySelector('input[name="declara_documentos"]').checked;
    const aceiteCondicoes = document.querySelector('input[name="aceite_condicoes"]').checked;
    const aceiteResponsabilidade = document.querySelector('input[name="aceite_responsabilidade"]').checked;

    if (
      !nome || !cpf || !whatsapp || !bairro || !endereco || !numero ||
      !tempoApp || (!uber && !noveNove) ||
      !declaraDocs || !aceiteCondicoes || !aceiteResponsabilidade
    ) {
      alert("⚠️ Preencha TODOS os campos obrigatórios.");
      return;
    }

    const atividade = [];
    if (uber) atividade.push("Uber Moto");
    if (noveNove) atividade.push("99 Moto");

    const mensagem = `
🟢 NOVA SOLICITAÇÃO – QUEBRA GALHO

Nome: ${nome}
CPF: ${cpf}
WhatsApp: ${whatsapp}

Endereço: ${endereco}, Nº ${numero}
Bairro: ${bairro}
Complemento: ${complemento || "Não informado"}

Atividade: ${atividade.join(", ")}
Tempo de app: ${tempoApp}

Valor: R$ 30
Pagamento: R$ 27 por dia
Prazo: 2 dias
Total: R$ 54
    `.trim();

    const numeroWhats = "554896986075";
    window.location.href = `https://wa.me/${numeroWhats}?text=${encodeURIComponent(mensagem)}`;
  });
});
</script>

</body>
</html>
